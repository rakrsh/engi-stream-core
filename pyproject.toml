[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engi-stream-core"
version = "0.1.0"
description = "High-performance data ingestion and orchestration system for agentic workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Engi Stream Team"}
]
keywords = ["data-ingestion", "orchestration", "agents", "streaming", "kubernetes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ravik/engi-stream-core"
Repository = "https://github.com/ravik/engi-stream-core.git"
Issues = "https://github.com/ravik/engi-stream-core/issues"
Documentation = "https://github.com/ravik/engi-stream-core/docs"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true

[tool.pylint]
max-line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
