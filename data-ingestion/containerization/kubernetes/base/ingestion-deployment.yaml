# Ingestion Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  labels:
    app: ingestion-service
    component: ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
        component: ingestion
    spec:
      containers:
      - name: ingestion
        image: ingestion-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: kafka.servers
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: database.url
        - name: NREL_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: nrel.api.key
        - name: NASA_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: nasa.api.key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
spec:
  selector:
    app: ingestion-service
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP